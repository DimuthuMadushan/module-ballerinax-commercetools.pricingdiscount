      - OrderExport
      - OrderImport
      - Primary
      x-annotation-package: Channel
      x-annotation-enumDescriptions:
        InventorySupply: Channel can be used to track inventory entries (for example, Channels with this role can be treated as warehouses).n
        ProductDistribution: Channel can be used to expose Products to a specific distribution Channel.nThe Channel can be used by a Cart to [select](/api/pricing-and-discounts-overview#line-item-price-selection) a Product Price.n
        OrderExport: Channel identifies a synchronization destination used when storing export information in [SyncInfo](ctp:api:type:SyncInfo).nYou can reference it with [Update SyncInfo](ctp:api:type:OrderUpdateSyncInfoAction) on Orders and Order Edits.n
        OrderImport: Channel identifies a synchronization destination used when storing import information in [SyncInfo](ctp:api:type:SyncInfo).nYou can reference it with [Update SyncInfo](ctp:api:type:OrderUpdateSyncInfoAction) on Orders and Order Edits.n
        Primary: Marks the Channel as the default or preferred Channel among Channels with the same role.nIt can be combined with another role, for example `InventorySupply`.n
